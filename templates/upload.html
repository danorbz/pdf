<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Form Filler – Upload</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        body.is-loading .upload-card {
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
        }
        .upload-card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 480px;
            width: 90%;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        h1 { color: #1a1a2e; margin-bottom: 8px; font-size: 28px; }
        p.subtitle { color: #666; margin-bottom: 32px; }
        .drop-zone {
            border: 3px dashed #ccc;
            border-radius: 12px;
            padding: 48px 24px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #4a6cf7;
            background: #f0f4ff;
        }
        .drop-zone .icon { font-size: 48px; margin-bottom: 12px; }
        .drop-zone p { color: #888; }
        input[type="file"] { display: none; }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #3451c7; }
        .page-loader {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 36%, rgba(74,108,247,0.16), transparent 32%),
                #f0f2f5;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.22s ease, visibility 0.22s ease;
        }
        body.is-loading .page-loader {
            opacity: 1;
            visibility: visible;
        }
        .loader-stage {
            display: grid;
            place-items: center;
            gap: 22px;
            color: #1a1a2e;
        }
        .loader-pages {
            position: relative;
            width: 96px;
            height: 118px;
            filter: drop-shadow(0 18px 24px rgba(26,26,46,0.18));
        }
        .loader-pages span {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            background: #fff;
            border: 1px solid rgba(26,26,46,0.12);
            overflow: hidden;
            transform-origin: center bottom;
            animation: pageFlip 1.45s ease-in-out infinite;
        }
        .loader-pages span:nth-child(1) { transform: rotate(-8deg) translateX(-12px); animation-delay: -0.22s; }
        .loader-pages span:nth-child(2) { transform: rotate(0deg); animation-delay: -0.1s; }
        .loader-pages span:nth-child(3) { transform: rotate(8deg) translateX(12px); }
        .loader-pages span::before {
            content: '';
            position: absolute;
            left: 16px;
            right: 16px;
            top: 24px;
            height: 7px;
            border-radius: 99px;
            background: #4a6cf7;
            box-shadow: 0 20px 0 rgba(74,108,247,0.28), 0 40px 0 rgba(26,26,46,0.12);
        }
        .loader-pages span::after {
            content: '';
            position: absolute;
            inset: -20% 0;
            background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,0.9), transparent 65%);
            animation: scanSheet 1.45s ease-in-out infinite;
        }
        .loader-text {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0;
        }
        @keyframes pageFlip {
            0%, 100% { translate: 0 0; rotate: 0deg; }
            50% { translate: 0 -10px; rotate: 5deg; }
        }
        @keyframes scanSheet {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(110%); }
        }
    </style>
</head>
<body class="is-loading">
    <div class="page-loader" id="pageLoader" aria-live="polite" aria-busy="true">
        <div class="loader-stage">
            <div class="loader-pages" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="loader-text" id="loaderText">Getting things ready...</div>
        </div>
    </div>

    <div class="upload-card">
        <h1>📄 PDF Form Filler</h1>
        <p class="subtitle">Load a PDF to add text and signatures</p>

        <form method="POST" action="/upload" enctype="multipart/form-data" id="uploadForm">
            <div class="drop-zone" id="dropZone">
                <div class="icon">📂</div>
                <p>Drag & drop a PDF here, or click to browse</p>
            </div>
            <input type="file" name="pdf" accept=".pdf" id="fileInput">
            <button type="submit" class="btn" id="submitBtn" style="display:none;">Open PDF</button>
        </form>

        <p id="fileName" style="color:#333; margin-top:12px; font-weight:500;"></p>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const submitBtn = document.getElementById('submitBtn');
        const fileName = document.getElementById('fileName');
        const form = document.getElementById('uploadForm');
        const loaderText = document.getElementById('loaderText');

        window.addEventListener('load', () => {
            document.body.classList.remove('is-loading');
        });

        function showLoader(message) {
            loaderText.textContent = message;
            document.body.classList.add('is-loading');
        }

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                onFileSelected();
            }
        });

        fileInput.addEventListener('change', onFileSelected);
        form.addEventListener('submit', () => {
            if (fileInput.files.length) {
                showLoader('Opening your PDF...');
            }
        });

        function onFileSelected() {
            if (fileInput.files.length) {
                fileName.textContent = fileInput.files[0].name;
                submitBtn.style.display = 'inline-block';
            }
        }
    </script>
</body>
</html>
